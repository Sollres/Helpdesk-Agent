name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests unitaires + tests d'intégration sur PostgreSQL/pgvector (Testcontainers, Docker fourni par le runner).
      # Aucun appel à un LLM : l'évaluation (./mvnw verify -Peval) se lance en local avec Ollama.
      - name: Build et tests
        run: ./mvnw -B verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: helpdesk-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
